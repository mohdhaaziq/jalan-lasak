<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Peta program Jalan Lasak — titik mula, checkpoint, laluan cadangan dan peta topo/satelit yang berfungsi tanpa talian.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jalan Lasak">
<meta name="theme-color" content="#201e1d">
<title>Jalan Lasak — Peta Program</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="assets/css/modernist.css">
<link rel="stylesheet" href="assets/css/app.css">
<script src="vendor/leaflet/leaflet.js" defer></script>
<script src="assets/js/app.js" type="module"></script>
</head>
<body>
<div id="app">

  <header id="topbar">
    <div>
      <div class="brand">JALAN LASAK</div>
      <div class="sub">Kuala Kubu Bharu · Peta Program</div>
    </div>
    <div id="netdot" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span><span id="netlabel">Online</span>
    </div>
  </header>

  <div id="map" role="application" aria-label="Peta program Jalan Lasak"></div>

  <div id="addbanner" role="status">Mod tambah — ketik pada peta untuk letak checkpoint</div>

  <div id="fabs">
    <button type="button" class="fab" id="btnLocate" title="Lokasi saya" aria-label="Lokasi saya" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
    </button>
    <button type="button" class="fab" id="btnAdd" title="Tambah checkpoint" aria-label="Tambah checkpoint" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button type="button" class="fab" id="btnDraw" title="Lukis laluan" aria-label="Lukis laluan cadangan" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20c4-1 3-6 6-8s7-1 10-8" stroke-dasharray="3 3"/><circle cx="4" cy="20" r="2" fill="currentColor" stroke="none"/><circle cx="20" cy="4" r="2" fill="currentColor" stroke="none"/></svg>
    </button>
    <button type="button" class="fab" id="btnFit" title="Lihat semua" aria-label="Lihat semua titik">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
  </div>

  <div id="drawbar" role="group" aria-label="Lukis laluan cadangan">
    <div>
      <div class="km" id="drawkm">0.00 km</div>
      <div class="hint">Ketik peta utk titik laluan</div>
    </div>
    <div class="sp"></div>
    <button type="button" class="jl-btn on-ink" id="drawUndo">Undo</button>
    <button type="button" class="jl-btn on-ink" id="drawCancel">Batal</button>
    <button type="button" class="jl-btn on-ink acc" id="drawDone">Siap</button>
  </div>

  <section id="sheet" class="open">
    <div id="strip">
      <div class="arrow"><svg id="arrowsvg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 L18 20 L12 16 L6 20 Z"/></svg></div>
      <div>
        <div class="tgt" id="tgtname">Sasaran: —</div>
        <div class="val" id="tgtdist">— km</div>
      </div>
      <div class="brg">
        <div class="tgt">Bearing</div>
        <div class="val" id="tgtbrg">—°</div>
      </div>
    </div>

    <button type="button" id="sheethead" aria-expanded="true" aria-controls="sheetbody">
      <span class="t">Checkpoint</span>
      <span class="n" id="cpcount"></span>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
    </button>

    <div id="sheetbody">
      <div id="layers" role="group" aria-label="Lapisan peta">
        <button type="button" data-layer="osm" class="on" aria-pressed="true">Denai OSM</button>
        <button type="button" data-layer="topo" aria-pressed="false">Topo</button>
        <button type="button" data-layer="sat" aria-pressed="false">Satelit</button>
      </div>

      <button type="button" class="check" id="contourrow" aria-pressed="false">
        <span class="box" aria-hidden="true"></span>
        <span><b>Kontur</b> — lapisan topo lutsinar atas satelit</span>
      </button>

      <div id="pointlist"></div>

      <div class="sect-head">Laluan cadangan <span class="n" id="rtcount"></span></div>
      <div id="routelist"></div>

      <div class="sect-head">Peta offline</div>
      <div id="offline">
        <div class="desc" id="offdesc">Simpan tile kawasan yang sedang dilihat supaya peta tetap terbuka tanpa talian.</div>
        <div class="acts">
          <button type="button" class="jl-btn acc" id="btnCache">Simpan kawasan ini</button>
          <button type="button" class="jl-btn" id="btnCacheClear">Kosongkan</button>
          <span class="stat" id="offstat"></span>
        </div>
        <div class="bar" id="offbar"><span id="offbarfill"></span></div>
      </div>
    </div>
  </section>

</div>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
