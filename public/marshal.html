<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Marshal checkpoint Jalan Lasak — catat setiap kumpulan yang tiba, walaupun tanpa isyarat.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#201e1d">
<title>Jalan Lasak — Marshal</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="assets/css/modernist.css">
<link rel="stylesheet" href="assets/css/app.css">
<script src="vendor/leaflet/leaflet.js" defer></script>
<script src="vendor/qrcode/qrcode.js" defer></script>
<script src="assets/js/marshal.js" type="module"></script>
</head>
<body class="page">
<div id="app" class="marshal">

  <header id="topbar">
    <div>
      <div class="brand">JALAN LASAK</div>
      <div class="sub">Kuala Kubu Bharu · Marshal</div>
    </div>
    <div id="netdot" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span><span id="netlabel">Online</span>
    </div>
  </header>

  <main id="mbody">
    <div id="mmapwrap">
      <div id="mmap" role="application" aria-label="Peta kedudukan kumpulan"></div>
      <button type="button" class="fab" id="btnMFit" title="Lihat semua" aria-label="Lihat semua kumpulan dan checkpoint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
      <div class="stat" id="mposstat"></div>
    </div>
    <div class="mhead">
      <div>
        <div class="t">Checkpoint</div>
        <div class="v" id="pointname">Belum dipilih</div>
      </div>
      <button type="button" class="jl-btn" id="btnPoint">Pilih checkpoint</button>
    </div>
    <div class="stat pad" id="mstat"></div>
    <div id="mcode" hidden>
      <div class="sect-head">Kod checkpoint ini</div>
      <div class="codebox">
        <div id="mqr" aria-hidden="true"></div>
        <div>
          <div class="big" id="mcodetext">—</div>
          <div class="desc">Ketua kumpulan taip kod ini, atau imbas QR, untuk membuka checkpoint seterusnya di telefonnya — berfungsi tanpa isyarat. Tetap tekan <b>Tiba</b> di bawah.</div>
        </div>
      </div>
    </div>
    <div class="sect-head">Kumpulan tiba</div>
    <div id="mlist"></div>
    <div class="foot"><a href="./">Paparan peserta →</a></div>
  </main>

</div>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
