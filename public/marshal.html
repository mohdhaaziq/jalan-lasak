<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Marshal checkpoint Jalan Lasak — catat setiap kumpulan yang tiba, walaupun tanpa isyarat.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#201e1d">
<title>Jalan Lasak — Marshal</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="assets/css/modernist.css">
<link rel="stylesheet" href="assets/css/app.css">
<script src="vendor/leaflet/leaflet.js" defer></script>
<script src="vendor/qrcode/qrcode.js" defer></script>
<script src="assets/js/marshal.js" type="module"></script>
</head>
<body class="page">
<div id="app" class="marshal">

  <header id="topbar">
    <div class="brand">JALAN LASAK <span class="sub">Marshal</span></div>
    <div id="netdot" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span><span id="netlabel">Online</span>
    </div>
  </header>

  <main id="mbody">
    <div class="mhead">
      <div>
        <div class="t">Checkpoint</div>
        <div class="v" id="pointname">Belum dipilih</div>
      </div>
      <button type="button" class="jl-btn" id="btnPoint">Pilih checkpoint</button>
    </div>
    <div class="stat pad top" id="mstat"></div>
    <div class="stat pad" id="mposstat"></div>

    <div id="mpanes">
      <section class="pane" id="pane-tiba" role="tabpanel" aria-labelledby="tab-tiba">
        <div id="mlist"></div>
        <div class="foot"><a href="./">Paparan peserta →</a></div>
      </section>

      <section class="pane" id="pane-kod" role="tabpanel" aria-labelledby="tab-kod" hidden>
        <div id="mcode" hidden>
          <div class="codebox">
            <div id="mqr" aria-hidden="true"></div>
            <div class="big" id="mcodetext">—</div>
            <div class="desc">Ketua kumpulan taip kod ini, atau imbas QR, untuk membuka checkpoint seterusnya di telefonnya — berfungsi tanpa isyarat. Tetap tekan <b>Tiba</b> untuk kumpulan itu.</div>
          </div>
        </div>
        <div class="empty" id="mcodeempty">Pilih checkpoint anda dahulu untuk melihat kodnya.</div>
      </section>

      <section class="pane" id="pane-peta" role="tabpanel" aria-labelledby="tab-peta" hidden>
        <div id="mmapwrap">
          <div id="mmap" role="application" aria-label="Peta kedudukan kumpulan"></div>
          <button type="button" class="fab" id="btnMFit" title="Lihat semua" aria-label="Lihat semua kumpulan dan checkpoint">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          </button>
        </div>
      </section>
    </div>
  </main>

  <nav id="tabbar" role="tablist" aria-label="Bahagian">
    <button type="button" role="tab" id="tab-tiba" data-pane="tiba" aria-selected="true" aria-controls="pane-tiba">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg>
      <span>Tiba <span class="n" id="tibacount"></span></span>
    </button>
    <button type="button" role="tab" id="tab-kod" data-pane="kod" aria-selected="false" aria-controls="pane-kod" tabindex="-1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3M21 14v7h-7M17 21v-1"/></svg>
      <span>Kod</span>
    </button>
    <button type="button" role="tab" id="tab-peta" data-pane="peta" aria-selected="false" aria-controls="pane-peta" tabindex="-1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 16 9 5 9-5"/></svg>
      <span>Peta</span>
    </button>
  </nav>

</div>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
