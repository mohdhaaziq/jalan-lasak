<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- Jalan Lasak app icon: the Modernist language at icon scale. Ink ground,
       no rounded corners, the dashed trail the app draws on the map, running
       from the red MULA square to a white checkpoint square. The trail stops
       short of both squares so no dash collides with a corner. -->
  <rect width="1000" height="1000" fill="#201e1d"/>
  <polyline points="318,672 430,528 560,572 682,318" fill="none" stroke="#f8f4f4" stroke-width="56"
            stroke-linejoin="round" stroke-linecap="butt" stroke-dasharray="72 50" stroke-dashoffset="-14"/>
  <rect x="115" y="705" width="180" height="180" fill="#ec3013"/>
  <rect x="705" y="115" width="180" height="180" fill="#f8f4f4"/>
  <rect x="755" y="165" width="80" height="80" fill="#ec3013"/>
</svg>
